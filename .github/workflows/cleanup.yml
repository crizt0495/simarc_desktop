name: Cleanup stale release assets

# Satu kali pakai: menghapus berkas .deb yang tidak sesuai versi tag
# (mis. pointer Git LFS 132 byte yang ikut terunggah pada rilis lama).
# Berkas workflow ini dihapus setelah pembersihan selesai.

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Hapus .deb yang tidak sesuai tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -n "$tag" ] || continue
            version="${tag#v}"
            expected="simarc_${version}-1_amd64.deb"
            echo "▸ ${tag} (menyimpan ${expected})"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
              case "$name" in
                *.deb)
                  if [ "$name" != "$expected" ]; then
                    echo "  hapus: $name"
                    gh release delete-asset "$tag" "$name" -y
                  fi
                  ;;
              esac
            done
          done
