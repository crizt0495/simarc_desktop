<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Varian sederhana: dipakai untuk ukuran 16–32 px agar tetap tajam. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12283D"/>
      <stop offset="0.45" stop-color="#0B1C2D"/>
      <stop offset="1" stop-color="#050D15"/>
    </linearGradient>
    <linearGradient id="goldFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9850F"/>
      <stop offset="0.25" stop-color="#D9B44A"/>
      <stop offset="0.5" stop-color="#F7E9AE"/>
      <stop offset="0.75" stop-color="#C9A03A"/>
      <stop offset="1" stop-color="#8A6A10"/>
    </linearGradient>
    <linearGradient id="goldLid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A10"/>
      <stop offset="0.3" stop-color="#E3C46B"/>
      <stop offset="0.5" stop-color="#F5E6A8"/>
      <stop offset="0.75" stop-color="#C9A03A"/>
      <stop offset="1" stop-color="#7A5E0C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF2"/>
      <stop offset="1" stop-color="#EDDDA8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5E6A8"/>
      <stop offset="0.5" stop-color="#C9A961"/>
      <stop offset="1" stop-color="#8A6A10"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="184" fill="url(#bg)"/>
  <rect x="20" y="20" width="984" height="984" rx="166" fill="none"
        stroke="url(#rim)" stroke-width="16" opacity="0.9"/>

  <!-- berkas -->
  <g transform="rotate(9 588 386)">
    <rect x="470" y="240" width="236" height="284" rx="26" fill="#E0C88E"/>
  </g>
  <g transform="rotate(-7 462 404)">
    <rect x="336" y="264" width="252" height="272" rx="26" fill="#F2E4B8"/>
  </g>
  <g transform="rotate(-1.5 486 396)">
    <rect x="368" y="248" width="236" height="292" rx="24" fill="url(#paper)"/>
  </g>

  <!-- kotak arsip -->
  <rect x="272" y="520" width="480" height="280" rx="30" fill="url(#goldFront)"
        stroke="#5E4806" stroke-width="8"/>
  <rect x="300" y="552" width="424" height="218" rx="20" fill="#000000" opacity="0.18"/>

  <rect x="352" y="586" width="320" height="136" rx="22" fill="#0A1A2B"
        stroke="url(#goldLid)" stroke-width="12"/>
  <polyline points="404,654 452,654 480,620 512,690 544,620 572,654 620,654"
            fill="none" stroke="#F5E6A8" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="244" y="444" width="536" height="108" rx="32" fill="url(#goldLid)"
        stroke="#5E4806" stroke-width="8"/>
</svg>
